# Refresh profile cards and generate the contribution snake
name: Refresh Profile Cards and Snake

# When the action runs
on:
  push:
    branches:
      - main
    paths:
      - README.md
      - profile_cards.py
      - .github/workflows/snake.yml
  schedule:
    # every day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:     # allow manual runs

# Allow the workflow to write to the repo
permissions:
  contents: write

jobs:
  build:
    name: Build profile assets
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout the repo so the job can access it
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install card renderer dependencies
        run: python -m pip install "fonttools[woff]"

      - name: Refresh contribution data and render profile cards
        run: |
          python profile_cards.py --refresh-data
          python profile_cards.py

      - name: Commit refreshed profile cards and data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cards/ contributions.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile cards"
            git push
          fi

      # Generate the snake SVG/GIF with Platane/snk
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: SourasishG
          outputs: |
            dist/github-snake.svg?color_snake=#26a641
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#26a641
            dist/github-snake.gif?color_snake=#26a641&color_dots=#9be9a8,#40c463,#30a14e,#216e39,#0f6d31

      # 3) Publish the dist folder to the "output" branch
      - name: Deploy snake to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output
          keep_files: true
